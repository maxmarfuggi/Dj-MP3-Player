[package]
name = "djusb-update"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Signed USB updates for the wall player, with a second system slot and rollback."

[lints]
workspace = true

[dependencies]
ed25519-dalek = "2.1.1"
getrandom = "0.2.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.8"
