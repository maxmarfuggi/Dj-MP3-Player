[package]
name = "djusb-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Reads rekordbox and Serato USB libraries."

[lints]
workspace = true

[dependencies]
djusb-sys = { path = "../djusb-sys" }
icu_collator = "2.4.0"
icu_locale_core = "2.4.0"
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[dev-dependencies]
serde_json = "1.0.154"
