[workspace]
resolver = "2"
members = [
    "crates/djusb-core",
    "crates/djusb-node",
    "crates/djusb-sys",
    "crates/djusb-projectm",
    "apps/device",
]

[workspace.package]
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
