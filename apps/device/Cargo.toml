[package]
name = "djusb-device"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Wall player for rekordbox and Serato USBs."

[lints]
workspace = true

[dependencies]
djusb-core = { path = "../../crates/djusb-core" }
djusb-projectm = { path = "../../crates/djusb-projectm" }
# Tokio is the executor, and it provides the timer that refreshes the list.
# The default set is trimmed: theme detection is left off because the window
# uses a fixed dark theme, and thread-pool is replaced by tokio.
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "canvas",
    "crisp",
    "web-colors",
    "tokio",
    "x11",
    "wayland",
    "image",
] }
# Playback. symphonia decodes, rubato converts to the output's sample rate,
# cpal plays through ALSA (and PipeWire's ALSA plugin) on the Pi and WASAPI
# on Windows, and rtrb carries samples to the output callback without locks.
# The default formats cover FLAC, WAV, Ogg and ID3 tags; the rest are the
# formats rekordbox and Serato export.
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "alac", "aiff"] }
rubato = "5.1.0"
cpal = "0.18.2"
rtrb = "0.4.1"
# The equalizer's spectrum. The same FFT the desktop's analyser runs.
rustfft = "6.4.1"

# The platter encoder and the round key. GPIO exists only on the Pi.
# bluer talks to BlueZ on the system bus. Tokio is the runtime iced already
# runs, named here so the pairing task can wait and spawn.
[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = "0.8.0"
bluer = { version = "0.17.4", default-features = false, features = ["bluetoothd"] }
# Vendored so the Pi cross build does not need libdbus headers in the image.
# The bundled libdbus is used under the AFL-2.1 licence choice.
dbus = { version = "0.9.7", features = ["vendored"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

# Reads docs/design-tokens.json while building. preserve_order keeps the
# generated CSS and Rust in the file's order.
[build-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }
