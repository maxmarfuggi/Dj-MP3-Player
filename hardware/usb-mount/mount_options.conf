# Read-only mounts for the wall player.
#
# udisks replaces its builtin common allow list with the one below, so
# leaving rw out means a read-write mount is refused. Filesystem defaults
# are merged with the common defaults, which is how ro reaches every type.
# umask=022 keeps a root-owned mount readable by the player user.
# FAT32 is vfat. flush and HFS+ force are left out because they write.

[defaults]
defaults=ro,noatime,noexec
allow=exec,noexec,nodev,nosuid,atime,noatime,nodiratime,ro,sync,dirsync,noload

vfat_defaults=uid=$UID,gid=$GID,shortname=mixed,utf8=1,umask=022
vfat_allow=uid=$UID,gid=$GID,utf8,shortname,umask,dmask,fmask,codepage,iocharset,usefree,showexec

exfat_defaults=uid=$UID,gid=$GID,iocharset=utf8,errors=remount-ro,umask=022
exfat_allow=uid=$UID,gid=$GID,umask,dmask,fmask,iocharset,errors,namecase,time_offset

hfsplus_defaults=uid=$UID,gid=$GID,nls=utf8,umask=022
hfsplus_allow=uid=$UID,gid=$GID,creator,type,umask,session,part,decompose,nodecompose,nls
